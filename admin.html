<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【本部用】緊急連絡更新</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background-color: #f0f0f0; padding: 20px; }
        .container { background: #fff; padding: 20px; border-radius: 8px; max-width: 600px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.2rem; text-align: center; color: #333; margin-bottom: 5px; }
        
        #sync-status { text-align: center; font-size: 0.9rem; color: #1976d2; font-weight: bold; margin-bottom: 15px; }
        
        label { display: block; margin-top: 15px; font-weight: bold; color: #333; }
        
        input[type="text"], input[type="time"] { 
            -webkit-appearance: none;
            width: 100%; padding: 12px; margin-top: 5px; 
            font-size: 1.1rem; border: 1px solid #ccc; border-radius: 4px; background-color: #fff;
        }
        input[type="text"]:focus, input[type="time"]:focus {
            border-color: #1976d2; outline: none; box-shadow: 0 0 5px rgba(25,118,210,0.3);
        }
        
        .radio-group { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .radio-group label { padding: 15px; text-align: center; background: #eee; border-radius: 4px; margin-top: 0; cursor: pointer; border: 2px solid transparent; font-weight: normal; }
        .radio-group input { display: none; }
        .radio-group input:checked + span { font-weight: bold; }
        
        /* 状態ごとの色設定（custom: 紫色 を追加） */
        .radio-group label:has(input[value="custom"]:checked) { border-color: #8e24aa; background: #f3e5f5; color: #8e24aa; }
        .radio-group label:has(input[value="wait_all"]:checked) { border-color: #d32f2f; background: #ffebee; color: #d32f2f; }
        .radio-group label:has(input[value="meeting"]:checked) { border-color: #f57f17; background: #fff8e1; color: #f57f17; }
        .radio-group label:has(input[value="resume"]:checked) { border-color: #1976d2; background: #e3f2fd; color: #1976d2; }
        .radio-group label:has(input[value="playing"]:checked) { border-color: #2e7d32; background: #e8f5e9; color: #2e7d32; }
        .radio-group label:has(input[value="finished"]:checked) { border-color: #616161; background: #f5f5f5; color: #616161; }

        /* 入力エリアのスタイル */
        #customTextArea { display: none; margin-top: 10px; background: #f3e5f5; padding: 15px; border-radius: 4px; border: 1px dashed #8e24aa; }
        #meetingTimeArea { display: none; margin-top: 10px; background: #fff8e1; padding: 15px; border-radius: 4px; border: 1px dashed #f57f17; }

        button.update-btn { margin-top: 25px; width: 100%; padding: 15px; background: #1976d2; color: white; border: none; border-radius: 4px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        button.update-btn:disabled { background: #999; }
        #msg { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>状況更新パネル</h1>
        <div id="sync-status">現在のデータを読み込み中...</div>
        
        <label>日付</label>
        <input type="text" id="dateText" placeholder="例: 7月19日（日）">
        
        <label>現在の時刻</label>
        <input type="time" id="timeText">
        
        <label style="margin-top:25px;">状況を選択</label>
        <div class="radio-group">
            <label><input type="radio" name="statusType" value="custom"> <span>直接入力（20文字以内）</span></label>
            <label><input type="radio" name="statusType" value="wait_all" checked> <span>全員待機</span></label>
            <label><input type="radio" name="statusType" value="meeting"> <span>待機 ＋ 監督会議</span></label>
            <label><input type="radio" name="statusType" value="resume"> <span>20分後競技再開</span></label>
            <label><input type="radio" name="statusType" value="playing"> <span>競技中</span></label>
            <label><input type="radio" name="statusType" value="finished"> <span>本日の競技はすべて終了しました</span></label>
        </div>

        <div id="customTextArea">
            <label style="margin-top: 0;">メッセージを入力してください</label>
            <input type="text" id="customText" maxlength="20" placeholder="例：〇〇コートへ集合してください">
        </div>

        <div id="meetingTimeArea">
            <label style="margin-top: 0;">監督会議の開始時刻を指定</label>
            <input type="time" id="meetingTime">
        </div>

        <button id="updateBtn" class="update-btn" onclick="updateStatus()" disabled>読み込み中...</button>
        <div id="msg"></div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbx5gcEOsmqJJs-rD31RSwvyS7KzaYB1XAlduPqNnwN98BjzROqI3XPYNSHtCRTARpnJ/exec";

        window.onload = () => {
            const now = new Date();
            const days = ["日", "月", "火", "水", "木", "金", "土"];
            document.getElementById('dateText').value = `${now.getMonth() + 1}月${now.getDate()}日（${days[now.getDay()]}）`;
            const currentTime = `${("0" + now.getHours()).slice(-2)}:${("0" + now.getMinutes()).slice(-2)}`;
            document.getElementById('timeText').value = currentTime;
            document.getElementById('meetingTime').value = currentTime;

            fetchCurrentData();
        };

        function fetchCurrentData() {
            fetch(GAS_URL)
                .then(response => response.json())
                .then(data => {
                    if (data.status) {
                        if (data.status === "本日の競技はすべて終了しました") {
                            document.querySelector('input[value="finished"]').checked = true;
                        } else if (data.status === "全員待機" || data.status === "待機") {
                            document.querySelector('input[value="wait_all"]').checked = true;
                        } else if (data.status.includes("監督会議を行います")) {
                            document.querySelector('input[value="meeting"]').checked = true;
                            document.getElementById('meetingTimeArea').style.display = 'block';
                            let timeMatch = data.status.match(/<br>(\d{2}:\d{2})から/);
                            if (timeMatch) document.getElementById('meetingTime').value = timeMatch[1];
                        } else if (data.status === "競技中") {
                            document.querySelector('input[value="playing"]').checked = true;
                        } else if (data.status === "20分後競技再開") {
                            document.querySelector('input[value="resume"]').checked = true;
                        } else {
                            // どれにも当てはまらない場合は直接入力として処理
                            document.querySelector('input[value="custom"]').checked = true;
                            document.getElementById('customTextArea').style.display = 'block';
                            document.getElementById('customText').value = data.status.replace(/<[^>]*>?/gm, ''); // HTMLタグを除去
                        }
                    }

                    document.getElementById('sync-status').style.display = 'none';
                    const btn = document.getElementById('updateBtn');
                    btn.disabled = false;
                    btn.innerText = "更新する";
                })
                .catch(err => {
                    document.getElementById('sync-status').innerText = "データの読み込みに失敗しました。ページをリロードしてください。";
                    document.getElementById('sync-status').style.color = "red";
                });
        }

        document.querySelectorAll('input[name="statusType"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.getElementById('meetingTimeArea').style.display = (e.target.value === 'meeting') ? 'block' : 'none';
                document.getElementById('customTextArea').style.display = (e.target.value === 'custom') ? 'block' : 'none';
            });
        });

        function updateStatus() {
            const btn = document.getElementById('updateBtn');
            const msg = document.getElementById('msg');
            btn.disabled = true;
            btn.innerText = "送信中...";
            msg.innerText = "";

            const type = document.querySelector('input[name="statusType"]:checked').value;
            let finalStatusText = "";

            if (type === "custom") {
                finalStatusText = document.getElementById('customText').value.trim();
                if (!finalStatusText) {
                    alert("直接入力の内容を入力してください。");
                    btn.disabled = false;
                    btn.innerText = "更新する";
                    return;
                }
            } else if (type === "finished") {
                finalStatusText = "本日の競技はすべて終了しました";
            } else if (type === "wait_all") {
                finalStatusText = "全員待機";
            } else if (type === "meeting") {
                const mTime = document.getElementById('meetingTime').value || "未定";
                finalStatusText = `選手・保護者（観客）待機<br>${mTime}から監督会議を行います`;
            } else if (type === "resume") {
                finalStatusText = "20分後競技再開";
            } else if (type === "playing") {
                finalStatusText = "競技中";
            }

            const data = {
                dateText: document.getElementById('dateText').value,
                timeText: document.getElementById('timeText').value,
                status: finalStatusText
            };

            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(res => {
                msg.innerText = "更新が完了しました！";
                msg.style.color = "green";
                btn.disabled = false;
                btn.innerText = "更新する";
                setTimeout(() => msg.innerText = "", 3000);
            })
            .catch(err => {
                msg.innerText = "エラーが発生しました";
                msg.style.color = "red";
                btn.disabled = false;
                btn.innerText = "更新する";
            });
        }
    </script>
</body>
</html>
